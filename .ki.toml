# Knowledge Islands repository configuration.
# Its presence declares conformance with the Knowledge Islands repository standard.

# -----------------------------------------------------------------------------
# Foundation
# -----------------------------------------------------------------------------

[repo]
backpacks = [
  "knowledgeislands/ki-agent-backpack",
]

[skills.ki-repo]
repo_type = "project"
primary_shape = "ki-repo-tools"
repository = "https://github.com/knowledgeislands/tools-rig"
title = "rig"
capital = "https://github.com/knowledgeislands/ki-principal"
description = "Describe and manage a person's working setup through catalogues, profiles, providers, and machine state."
repo_code = "KI-TOOL-RIG"
supported_runtimes = [
  "claude-code",
  "claude-desktop",
  "chatgpt-codex",
]
visibility = "public"
license = "MIT"

[skills.ki-authoring]

# -----------------------------------------------------------------------------
# Repository shape
# -----------------------------------------------------------------------------

[skills.ki-repo-project]

[skills.ki-repo-tools]

[[skills.ki-repo-tools.assembled]]
artifact = "bin/rig"
sources = [
  "src/rig",
]
check = [
  "scripts/assemble-rig",
  "--check",
]

# -----------------------------------------------------------------------------
# Governance and runtime
# -----------------------------------------------------------------------------

[skills.ki-decision-records]

[skills.ki-specs]

[skills.ki-guides]

[skills.ki-env-binding]

[skills.ki-env-binding-claude]

[skills.ki-env-binding-chatgpt]

[skills.ki-env-housekeeping]

[skills.ki-env-housekeeping-claude]
auto_memory = "disabled"

[skills.ki-env-housekeeping-chatgpt]
auto_memory = "disabled"

[skills.ki-env-tokenomics]

[skills.ki-env-tokenomics-claude]

[skills.ki-env-tokenomics-chatgpt]

# -----------------------------------------------------------------------------
# Change management
# -----------------------------------------------------------------------------

[skills.ki-git]

[skills.ki-work]
adapter = "roadmap"

[skills.ki-work-roadmap]
components = [
  "cli",
  "distribution",
  "migration",
  "orchestration",
]

[skills.ki-work-roadmap.areas]
CLI = "Command-line interface"
CORE = "Core engine"
DIST = "Releases and distribution"
MIG = "Migration from chezmoi"
