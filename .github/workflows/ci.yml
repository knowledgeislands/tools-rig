name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  BATS_VERSION: v1.11.1
  KI_VERSION: v0.8.1

jobs:
  governance:
    name: KI governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The audit's Markdown gate runs rumdl through bunx.
      - uses: oven-sh/setup-bun@v2
      - name: Install released KI
        env:
          KI_CLI_INSTALL_DIR: ${{ runner.temp }}/ki/bin
          KI_MAN_INSTALL_DIR: ${{ runner.temp }}/ki/man/man1
          KI_DATA_HOME: ${{ runner.temp }}/ki/data
          KI_CONFIG_HOME: ${{ runner.temp }}/ki/config
          KI_CACHE_HOME: ${{ runner.temp }}/ki/cache
          KI_MCP_SOURCE: ${{ runner.temp }}/ki/mcp-servers.yaml
          XDG_STATE_HOME: ${{ runner.temp }}/ki/state
          KI_STATE_HOME: ${{ runner.temp }}/ki/state/ki
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.agents" "$HOME/.claude"
          printf '{"autoMemoryEnabled": false}\n' > "$HOME/.claude/settings.json"
          mkdir -p "$(dirname "$KI_MCP_SOURCE")"
          printf 'mcpServers: []\n' > "$KI_MCP_SOURCE"
          curl --fail -sSL --proto '=https' -o "$RUNNER_TEMP/install.sh" \
            "https://raw.githubusercontent.com/knowledgeislands/tools-ki/$KI_VERSION/install.sh"
          bash "$RUNNER_TEMP/install.sh" "$KI_VERSION"
          export PATH="$KI_CLI_INSTALL_DIR:$PATH"
          test "$(command -v ki)" = "$KI_CLI_INSTALL_DIR/ki"
          test "v$(ki --version)" = "$KI_VERSION"
          ki bootstrap
          ki registry add --repo .
          ki repo repair --repo .
          {
            printf 'KI_CLI_INSTALL_DIR=%s\n' "$KI_CLI_INSTALL_DIR"
            printf 'KI_MAN_INSTALL_DIR=%s\n' "$KI_MAN_INSTALL_DIR"
            printf 'KI_DATA_HOME=%s\n' "$KI_DATA_HOME"
            printf 'KI_CONFIG_HOME=%s\n' "$KI_CONFIG_HOME"
            printf 'KI_CACHE_HOME=%s\n' "$KI_CACHE_HOME"
            printf 'KI_MCP_SOURCE=%s\n' "$KI_MCP_SOURCE"
            printf 'XDG_STATE_HOME=%s\n' "$XDG_STATE_HOME"
            printf 'KI_STATE_HOME=%s\n' "$KI_STATE_HOME"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$KI_CLI_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Audit
        run: ki repo audit --repo .

  lint:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          shellcheck bin/rig install.sh src/rig/*.bash \
            scripts/assemble-rig scripts/benchmark-rig scripts/smoke-native-providers
      - name: Parse every shell source
        run: |
          for script in bin/rig install.sh src/rig/*.bash \
            scripts/assemble-rig scripts/benchmark-rig scripts/smoke-native-providers; do
            bash -n "$script" || exit 1
          done
      - name: Check the assembled executable matches its sources
        run: scripts/assemble-rig --check

  test:
    name: Bats
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Install pinned Bats
        run: |
          git clone --depth 1 --branch "$BATS_VERSION" \
            https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
          sudo "$RUNNER_TEMP/bats-core/install.sh" /usr/local
          bats --version
      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: bats --print-output-on-failure tests/ </dev/null
      - name: Provide a TOML-capable interpreter for the tests
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests with macOS system Bash
        if: runner.os == 'macOS'
        run: |
          /bin/bash --version
          bats_bin=$(command -v bats)
          test_python=$(command -v python3)
          RIG_TEST_PYTHON="$test_python" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            "$bats_bin" --print-output-on-failure tests/ </dev/null

  manual:
    name: mandoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mandoc
        run: sudo apt-get update && sudo apt-get install -y mandoc
      - name: Lint manual
        run: mandoc -T lint man/rig.1

  release-tag:
    name: Release tag matches executable
    if: startsWith(github.ref, 'refs/tags/')
    needs: [governance, lint, test, manual]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag and Rig version
        run: |
          tag_version=${GITHUB_REF_NAME#v}
          rig_version=$(sed -n 's/^RIG_VERSION=//p' bin/rig)
          case "$tag_version" in
            ''|*[!0-9.]*|*.*.*.*)
              printf 'release tag must use final vX.Y.Z form: %s\n' "$GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac
          if ! printf '%s\n' "$tag_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            printf 'release tag must use final vX.Y.Z form: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [ "$tag_version" != "$rig_version" ]; then
            printf 'release tag %s does not match Rig version %s\n' \
              "$GITHUB_REF_NAME" "$rig_version" >&2
            exit 1
          fi
