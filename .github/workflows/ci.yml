name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  BATS_VERSION: v1.11.1

jobs:
  lint:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          shellcheck bin/rig install.sh src/rig/*.bash \
            scripts/assemble-rig scripts/benchmark-rig scripts/smoke-native-providers
      - name: Parse every shell source
        run: |
          bash -n bin/rig install.sh src/rig/*.bash \
            scripts/assemble-rig scripts/benchmark-rig scripts/smoke-native-providers
      - name: Check the assembled executable matches its sources
        run: scripts/assemble-rig --check

  test:
    name: Bats
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Install pinned Bats
        run: |
          git clone --depth 1 --branch "$BATS_VERSION" \
            https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
          sudo "$RUNNER_TEMP/bats-core/install.sh" /usr/local
          bats --version
      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: bats --print-output-on-failure tests/
      - name: Provide a TOML-capable interpreter for the tests
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests with macOS system Bash
        if: runner.os == 'macOS'
        run: |
          /bin/bash --version
          bats_bin=$(command -v bats)
          test_python=$(command -v python3)
          RIG_TEST_PYTHON="$test_python" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            "$bats_bin" --print-output-on-failure tests/

  manual:
    name: mandoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mandoc
        run: sudo apt-get update && sudo apt-get install -y mandoc
      - name: Lint manual
        run: mandoc -T lint man/rig.1

  release-tag:
    name: Release tag matches executable
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test, manual]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag and Rig version
        run: |
          tag_version=${GITHUB_REF_NAME#v}
          rig_version=$(sed -n 's/^RIG_VERSION=//p' bin/rig)
          case "$tag_version" in
            ''|*[!0-9.]*|*.*.*.*)
              printf 'release tag must use final vX.Y.Z form: %s\n' "$GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac
          if ! printf '%s\n' "$tag_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            printf 'release tag must use final vX.Y.Z form: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [ "$tag_version" != "$rig_version" ]; then
            printf 'release tag %s does not match Rig version %s\n' \
              "$GITHUB_REF_NAME" "$rig_version" >&2
            exit 1
          fi
