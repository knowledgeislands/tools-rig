name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: shellcheck bin/rig install.sh

  test:
    name: Bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run tests
        run: bats tests/

  manual:
    name: mandoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mandoc
        run: sudo apt-get update && sudo apt-get install -y mandoc
      - name: Lint manual
        run: mandoc -T lint man/rig.1
